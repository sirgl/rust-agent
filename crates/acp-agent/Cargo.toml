[package]
name = "acp-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "acp_agent"
path = "src/lib.rs"

[[bin]]
name = "acp-agent"
path = "src/main.rs"

[features]
default = []
unstable_protocol_v2 = ["agent-client-protocol/unstable_protocol_v2", "dep:base64"]

[dependencies]
agent-core.workspace = true
turn-anthropic.workspace = true
turn-replay.workspace = true
tools-builtin.workspace = true
mcp-client.workspace = true
subagents.workspace = true
orchestrated.workspace = true
llm-inspector.workspace = true
agent-client-protocol.workspace = true
async-trait.workspace = true
base64 = { workspace = true, optional = true }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
